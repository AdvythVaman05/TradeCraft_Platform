[build]
builder = "NIXPACKS"
buildCommand = "python -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir -r requirements.txt && /opt/venv/bin/python backend/manage.py collectstatic --noinput"

[deploy]
preDeployCommand = "cd backend && /opt/venv/bin/python manage.py migrate --noinput"
startCommand = "cd backend && /opt/venv/bin/daphne -b 0.0.0.0 -p $PORT project.asgi:application"
healthcheckPath = "/health/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
